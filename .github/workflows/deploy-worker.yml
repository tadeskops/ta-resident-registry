name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Verify required secrets are set
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GH_TOKEN: ${{ secrets.TRR_GH_TOKEN }}
        run: |
          missing=""
          [ -z "$JWT_SECRET" ] && missing="$missing JWT_SECRET"
          [ -z "$GH_TOKEN" ]   && missing="$missing TRR_GH_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub secret(s):$missing"
            echo "Set them at: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "OK — all required secrets present."

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Vitest
        run: npx vitest run --reporter=default

      - name: Sync JWT_SECRET
        run: printf '%s' "$JWT_SECRET" | npx wrangler secret put JWT_SECRET
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Sync GH_TOKEN
        run: printf '%s' "$GH_TOKEN" | npx wrangler secret put GH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.TRR_GH_TOKEN }}

      - name: Sync RESEND_API_KEY (skips if empty)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          else
            echo "RESEND_API_KEY secret not set — leaving existing CF secret in place."
          fi

      - name: Deploy
        run: npx wrangler deploy

      - name: Summary
        run: |
          echo "### Worker deployed ✅" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`$GITHUB_SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "See run logs above for the deploy URL." >> $GITHUB_STEP_SUMMARY

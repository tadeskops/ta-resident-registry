name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Vitest
        run: npx vitest run --reporter=default

      - name: Sync JWT_SECRET
        run: echo "$JWT_SECRET" | npx wrangler secret put JWT_SECRET
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Sync GH_TOKEN
        run: echo "$GH_TOKEN" | npx wrangler secret put GH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.TRR_GH_TOKEN }}

      - name: Sync RESEND_API_KEY (skips if empty)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          else
            echo "RESEND_API_KEY secret not set — leaving existing CF secret in place."
          fi

      - name: Deploy
        run: npx wrangler deploy

      - name: Summary
        run: |
          echo "### Worker deployed ✅" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`$GITHUB_SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "See run logs above for the deploy URL." >> $GITHUB_STEP_SUMMARY
